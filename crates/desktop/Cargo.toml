[package]
name = "desktop"
version = "0.1.0"
description = "Roastro's native desktop app (GPUI): the live roast screen over the in-process engine."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "roastro-desktop"
path = "src/main.rs"

[features]
# Headless UI tests: cargo test -p desktop --features ui-test
ui-test = ["gpui-kit/test-support"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
gpui-kit.workspace = true
jiff.workspace = true
regmap = { path = "../regmap" }
roast = { path = "../roast" }
roastro = { path = "../roastro" }
sim = { path = "../sim" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-modbus = { workspace = true, features = ["tcp-server"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[lints]
workspace = true
