[package]
name = "plc"
version = "0.1.0"
description = "Talks to the roaster PLC over Modbus TCP by point name."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
regmap = { path = "../regmap" }
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "sync", "time", "rt", "macros"] }
tokio-modbus = { workspace = true, features = ["tcp"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread"] }
tokio-modbus = { workspace = true, features = ["tcp-server"] }

[lints]
workspace = true
