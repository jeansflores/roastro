[package]
name = "roastro"
version = "0.1.0"
description = "The Roastro app: reads the PLC, records every roast."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["ws"] }
clap.workspace = true
dirs.workspace = true
jiff.workspace = true
plc = { path = "../plc" }
recorder = { path = "../recorder" }
regmap = { path = "../regmap" }
roast = { path = "../roast" }
serde.workspace = true
serde_json.workspace = true
store = { path = "../store" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
sim = { path = "../sim" }
tokio-modbus = { workspace = true, features = ["tcp-server"] }

[lints]
workspace = true
